services:
  - type: web
    name: smart-cooperative-hub-backend
    env: node
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 5001
      - key: FRONTEND_URL
        value: https://smart-cooperative-hub.onrender.com

